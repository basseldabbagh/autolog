<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="critGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="url(#bgCanvas)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="150" r="180" fill="#4f46e5" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="1050" cy="480" r="220" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />

  <!-- LEFT BRANDING COLUMN -->
  <g transform="translate(80, 80)">
    <!-- App Logo Icon Badge -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="20" fill="url(#brandGrad)" />
      <!-- Stylized mini car silhouette inside logo -->
      <path d="M18 48 L22 36 C24 33 27 30 31 30 L41 30 C45 30 48 33 50 36 L54 48 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />
      <path d="M14 42 C14 40 16 38 18 38 L54 38 C56 38 58 40 58 42 L59 50 C59 53 56 56 52 56 L20 56 C16 56 13 53 13 50 Z" fill="#ffffff" />
      <circle cx="36" cy="52" r="4" fill="#10b981" />
    </g>

    <!-- App Title & Badge -->
    <text x="92" y="46" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">MotoFolio</text>
    <rect x="250" y="24" width="76" height="26" rx="13" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1.5" />
    <text x="288" y="41" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.05em">v2.0 PWA</text>

    <!-- Headline -->
    <text x="0" y="142" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">
      <tspan x="0" dy="0">Universal Car Maintenance</tspan>
      <tspan x="0" dy="54" fill="url(#brandGrad)">&amp; Service Tracker</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="270" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8" line-height="28">
      <tspan x="0" dy="0">Intelligent periodic intervals, dynamic odometer simulation,</tspan>
      <tspan x="0" dy="28">workshop expense logs, and printable A4 inspection reports.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 345)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#10b981" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Periodic Schedule</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#38bdf8" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Workshop Ledger</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 48)">
        <rect width="175" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#f59e0b" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Print A4 Condition</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(187, 48)">
        <rect width="175" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#a855f7" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">100% Client-Side</text>
      </g>
    </g>

    <text x="0" y="475" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#64748b">
      Zero Cloud Lock-in • Google Drive Backup • Offline Ready
    </text>
  </g>

  <!-- RIGHT INTERACTIVE CARD PREVIEW -->
  <g transform="translate(680, 75)">
    <!-- Main Card Body -->
    <rect width="440" height="480" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Vehicle Header Row -->
    <g transform="translate(28, 30)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#ffffff">2022 Executive Sedan</text>
      <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#94a3b8">WAA 1234 • 2.0L Turbocharged AT</text>
      
      <!-- Live Odometer Pill -->
      <rect x="260" y="2" width="124" height="42" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <text x="322" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">ODOMETER</text>
      <text x="322" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">145,200 km</text>
    </g>

    <!-- Divider -->
    <line x1="28" y1="102" x2="412" y2="102" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

    <!-- Schedule Status Summary Row -->
    <g transform="translate(28, 122)">
      <!-- Good Badge -->
      <rect x="0" y="0" width="116" height="44" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <text x="14" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">GOOD</text>
      <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#a7f3d0">14 items</text>

      <!-- Due Soon Badge -->
      <rect x="134" y="0" width="116" height="44" rx="10" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1" />
      <text x="148" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fcd34d">DUE SOON</text>
      <text x="148" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fef3c7">2 items</text>

      <!-- Overdue Badge -->
      <rect x="268" y="0" width="116" height="44" rx="10" fill="#881337" fill-opacity="0.4" stroke="#e11d48" stroke-width="1" />
      <text x="282" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fda4af">OVERDUE</text>
      <text x="282" y="36" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffe4e6">0 items</text>
    </g>

    <!-- Simulated Maintenance Items List -->
    <g transform="translate(28, 192)">
      <!-- Item 1: Engine Oil (Due Soon) -->
      <g transform="translate(0, 0)">
        <rect width="384" height="66" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Engine Oil &amp; Filter (5W-30)</text>
        <rect x="284" y="12" width="84" height="22" rx="6" fill="#f59e0b" fill-opacity="0.2" />
        <text x="326" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">DUE IN 350 KM</text>
        <!-- Progress bar -->
        <rect x="16" y="44" width="352" height="6" rx="3" fill="#1e293b" />
        <rect x="16" y="44" width="324" height="6" rx="3" fill="url(#warnGrad)" />
      </g>

      <!-- Item 2: Spark Plugs (Good) -->
      <g transform="translate(0, 78)">
        <rect width="384" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Iridium Spark Plugs</text>
        <rect x="284" y="12" width="84" height="22" rx="6" fill="#10b981" fill-opacity="0.2" />
        <text x="326" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">GOOD (18,400 KM)</text>
        <!-- Progress bar -->
        <rect x="16" y="44" width="352" height="6" rx="3" fill="#1e293b" />
        <rect x="16" y="44" width="160" height="6" rx="3" fill="url(#goodGrad)" />
      </g>

      <!-- Item 3: ATF Fluid (Good) -->
      <g transform="translate(0, 156)">
        <rect width="384" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Automatic Transmission Fluid</text>
        <rect x="284" y="12" width="84" height="22" rx="6" fill="#10b981" fill-opacity="0.2" />
        <text x="326" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">GOOD (9,800 KM)</text>
        <!-- Progress bar -->
        <rect x="16" y="44" width="352" height="6" rx="3" fill="#1e293b" />
        <rect x="16" y="44" width="240" height="6" rx="3" fill="url(#goodGrad)" />
      </g>
    </g>

    <!-- Bottom summary row in card -->
    <g transform="translate(28, 442)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="18" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748b">Health Index: 92% • 0 Critical Alerts</text>
      <text x="384" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#818cf8" text-anchor="end">motofolio.pages.dev</text>
    </g>
  </g>
</svg>
