<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050d1a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8559" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162c4b" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0f223d" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="critGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a63" stroke-width="1" stroke-opacity="0.28" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
  </defs>

  <!-- Deep Navy Background (#0A192F) -->
  <rect width="1200" height="630" fill="url(#bgCanvas)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="180" cy="140" r="190" fill="#ff6b35" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="1040" cy="490" r="220" fill="#06b6d4" opacity="0.11" filter="url(#softGlow)" />

  <!-- LEFT BRANDING COLUMN -->
  <g transform="translate(76, 76)">
    <!-- App Icon Badge (Tire + Orange Gauge Hands) -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="18" fill="#0f223d" stroke="#1e3a63" stroke-width="1.5" />
      <g transform="translate(36, 36)">
        <!-- Outer tire ring -->
        <circle cx="0" cy="0" r="22" fill="none" stroke="#bbd3ec" stroke-width="6" />
        <!-- Inner rim -->
        <circle cx="0" cy="0" r="14" fill="none" stroke="#bbd3ec" stroke-width="2" stroke-opacity="0.85" />
        <circle cx="0" cy="0" r="5" fill="none" stroke="#bbd3ec" stroke-width="2" />
        <!-- Spokes -->
        <line x1="0" y1="-14" x2="0" y2="-5" stroke="#bbd3ec" stroke-width="2" />
        <line x1="0" y1="5" x2="0" y2="14" stroke="#bbd3ec" stroke-width="2" />
        <line x1="-14" y1="0" x2="-5" y2="0" stroke="#bbd3ec" stroke-width="2" />
        <line x1="-10" y1="-10" x2="-3.5" y2="-3.5" stroke="#bbd3ec" stroke-width="2" />
        <line x1="-10" y1="10" x2="-3.5" y2="3.5" stroke="#bbd3ec" stroke-width="2" />
        <line x1="10" y1="10" x2="3.5" y2="3.5" stroke="#bbd3ec" stroke-width="2" />
        <!-- Orange top-right arc -->
        <path d="M 0 -22 A 22 22 0 0 1 22 0" fill="none" stroke="#ff6b35" stroke-width="6.5" stroke-linecap="round" />
        <!-- Orange clock/gauge hands -->
        <path d="M 0 -11 L 0 0 L 11 0" fill="none" stroke="#ff6b35" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Brand Title & Pill -->
    <text x="90" y="47" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="#ff6b35">my </tspan>
      <tspan fill="#f8fafc">motofolio</tspan>
    </text>
    <rect x="306" y="24" width="114" height="26" rx="13" fill="#ff6b35" fill-opacity="0.15" stroke="#ff6b35" stroke-opacity="0.45" stroke-width="1.2" />
    <text x="363" y="41" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ff8559" text-anchor="middle" letter-spacing="0.06em">OFFLINE PWA</text>

    <!-- Headline -->
    <text x="0" y="142" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">
      <tspan x="0" dy="0">Free Car Maintenance</tspan>
      <tspan x="0" dy="54" fill="url(#brandGrad)">&amp; Service Interval Tracker</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="268" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#bbd3ec">
      <tspan x="0" dy="0">Periodic service intervals, live odometer tracking, workshop</tspan>
      <tspan x="0" dy="28">expense ledger, fuel logbook &amp; printable A4 inspection reports.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 344)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="178" height="38" rx="19" fill="#0f223d" stroke="#1e3a63" stroke-width="1.2" />
        <circle cx="22" cy="19" r="5.5" fill="#10b981" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Periodic Schedule</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(190, 0)">
        <rect width="172" height="38" rx="19" fill="#0f223d" stroke="#1e3a63" stroke-width="1.2" />
        <circle cx="22" cy="19" r="5.5" fill="#06b6d4" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Workshop Ledger</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 48)">
        <rect width="154" height="38" rx="19" fill="#0f223d" stroke="#1e3a63" stroke-width="1.2" />
        <circle cx="22" cy="19" r="5.5" fill="#ff6b35" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Fuel Logbook</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(166, 48)">
        <rect width="168" height="38" rx="19" fill="#0f223d" stroke="#1e3a63" stroke-width="1.2" />
        <circle cx="22" cy="19" r="5.5" fill="#f59e0b" />
        <text x="36" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">A4 PDF Report</text>
      </g>
    </g>

    <text x="0" y="476" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#748ba7">
      100% Private • Google Drive Sync • Zero Cloud Lock-in
    </text>
  </g>

  <!-- RIGHT INTERACTIVE CARD PREVIEW -->
  <g transform="translate(682, 75)">
    <!-- Main Card Body -->
    <rect width="442" height="480" rx="24" fill="url(#cardGrad)" stroke="#1e3a63" stroke-width="1.5" />

    <!-- Vehicle Header Row -->
    <g transform="translate(28, 30)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">2021 Sedan 2.0L</text>
      <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#bbd3ec">SAMPLE 123 • 2.0L Inline-4</text>

      <!-- Live Odometer Pill -->
      <rect x="260" y="2" width="126" height="44" rx="10" fill="#081426" stroke="#2d4f7c" stroke-width="1.2" />
      <text x="323" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#748ba7" text-anchor="middle" letter-spacing="0.06em">ODOMETER</text>
      <text x="323" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ff6b35" text-anchor="middle">45,000 km</text>
    </g>

    <!-- Divider -->
    <line x1="28" y1="100" x2="414" y2="100" stroke="#1e3a63" stroke-width="1" />

    <!-- Schedule Status Summary Row -->
    <g transform="translate(28, 120)">
      <!-- Good Badge -->
      <rect x="0" y="0" width="118" height="46" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
      <text x="14" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">GOOD</text>
      <text x="14" y="37" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#a7f3d0">6 items</text>

      <!-- Due Soon Badge -->
      <rect x="134" y="0" width="118" height="46" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1" />
      <text x="148" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fcd34d">DUE SOON</text>
      <text x="148" y="37" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fde68a">2 items</text>

      <!-- Overdue Badge -->
      <rect x="268" y="0" width="118" height="46" rx="10" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1" />
      <text x="282" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fda4af">OVERDUE</text>
      <text x="282" y="37" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fecdd3">0 items</text>
    </g>

    <!-- Simulated Maintenance Items List -->
    <g transform="translate(28, 190)">
      <!-- Item 1: Engine Oil (Due Soon) -->
      <g transform="translate(0, 0)">
        <rect width="386" height="66" rx="12" fill="#081426" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Engine Oil &amp; Filter</text>
        <rect x="272" y="12" width="98" height="22" rx="6" fill="#f59e0b" fill-opacity="0.18" />
        <text x="321" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fcd34d" text-anchor="middle">DUE IN 800 KM</text>
        <!-- Progress bar -->
        <rect x="16" y="44" width="354" height="6" rx="3" fill="#162c4b" />
        <rect x="16" y="44" width="318" height="6" rx="3" fill="url(#warnGrad)" />
      </g>

      <!-- Item 2: Tire Rotation (Good) -->
      <g transform="translate(0, 78)">
        <rect width="386" height="66" rx="12" fill="#081426" stroke="#1e3a63" stroke-width="1" />
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Tire Rotation &amp; Balance</text>
        <rect x="272" y="12" width="98" height="22" rx="6" fill="#10b981" fill-opacity="0.18" />
        <text x="321" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">5,000 KM LEFT</text>
        <!-- Progress bar -->
        <rect x="16" y="44" width="354" height="6" rx="3" fill="#162c4b" />
        <rect x="16" y="44" width="177" height="6" rx="3" fill="url(#goodGrad)" />
      </g>

      <!-- Item 3: Brake Fluid Flush (Good) -->
      <g transform="translate(0, 156)">
        <rect width="386" height="66" rx="12" fill="#081426" stroke="#1e3a63" stroke-width="1" />
        <text x="16" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Brake Fluid Flush</text>
        <rect x="272" y="12" width="98" height="22" rx="6" fill="#10b981" fill-opacity="0.18" />
        <text x="321" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">35,000 KM LEFT</text>
        <!-- Progress bar -->
        <rect x="16" y="44" width="354" height="6" rx="3" fill="#162c4b" />
        <rect x="16" y="44" width="60" height="6" rx="3" fill="url(#goodGrad)" />
      </g>
    </g>

    <!-- Bottom summary row in card -->
    <g transform="translate(28, 442)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="18" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#748ba7">Health Index: 92% • 0 Overdue</text>
      <text x="386" y="10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#ff6b35" text-anchor="end">motofolio.pages.dev</text>
    </g>
  </g>
</svg>
